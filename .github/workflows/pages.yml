name: Build and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.18'
      - name: Verify shared core
        run: |
          for test in game character icons nurture motion grove power handling utilities; do
            cc -std=c11 -O2 -Icore tests/test_$test.c core/*.c third_party/pocket_tank/{q4_model,word_tok}.c -Ithird_party/pocket_tank -lm -o /tmp/pg-test
            /tmp/pg-test
          done
      - run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: public-website
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
